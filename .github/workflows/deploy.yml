name: Deploy

# A version is a tag. Pushing v1.2.3 builds that commit, runs the suite against it, and
# publishes it to GitHub Pages — nothing reaches the site without passing first.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time, and a newer tag waits rather than racing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm test

      - name: Build
        # the site lives at /<repo>/, and the bundle has to be built knowing that
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # enablement turns Pages on the first time, so the first release does not need
      # someone to visit the settings page before it can land
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
